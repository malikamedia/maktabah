<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maktabah Malika Boarding School</title>
<style>
:root{--navy:#14264a;--navy2:#1f3a6e;--cream:#faf5ec;--wood:#d9b98a;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e6dccb}
@media(prefers-color-scheme:dark){:root{--cream:#0f1729;--card:#18233d;--text:#eef1f7;--muted:#a3adc2;--line:#2a3857;--navy:#e8d9bd;--navy2:#d9b98a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--text)}
header{background:linear-gradient(135deg,#14264a,#24467f);color:#fff;text-align:center;padding:36px 16px 56px}
header h1{margin:0;font-size:1.8rem}header p{margin:6px 0 0;opacity:.85}
.ar{font-size:1.4rem;margin-bottom:4px}
.box{max-width:820px;margin:-30px auto 0;padding:0 14px}
form{display:flex;gap:8px;background:var(--card);padding:10px;border-radius:14px;box-shadow:0 6px 24px #0002}
input[type=search]{flex:1;border:0;font-size:1.05rem;padding:10px;background:transparent;color:var(--text);outline:0;min-width:0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:#14264a;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 2px}
.chips label{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:.88rem;cursor:pointer;user-select:none}
.chips input{margin-right:6px}
main{max-width:820px;margin:0 auto;padding:0 14px 60px}
.status{color:var(--muted);margin:10px 2px;font-size:.92rem}
.group{margin:22px 0 8px;font-weight:700;color:var(--navy2);border-bottom:2px solid var(--wood);padding-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:1.05rem;color:var(--navy2);cursor:pointer}
.card h3:hover{text-decoration:underline}
.card p{margin:6px 0;line-height:1.6;font-size:.95rem}
.arab{direction:rtl;text-align:right;font-size:1.25rem;line-height:2}
mark{background:#ffe08a;color:#222;padding:0 2px;border-radius:3px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.tag{background:var(--wood);color:#3b2a10;padding:1px 8px;border-radius:99px;font-weight:600}
.meta button{padding:4px 10px;font-size:.8rem;background:var(--navy2);color:#fff}
.meta a{color:var(--navy2);font-weight:600}
dialog{width:min(900px,96vw);height:min(86vh,800px);border:0;border-radius:14px;padding:0;background:var(--card);color:var(--text)}
dialog::backdrop{background:#0008}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{height:calc(100% - 54px);overflow:auto;padding:14px 18px}
.mb iframe{width:100%;height:100%;border:0}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
</style>
</head>
<body>
<header>
  <div class="ar">مكتبة مالك</div>
  <h1>Maktabah Malika</h1>
  <p>Pondok Pesantren Malika · Malika Islamic School</p>
</header>

<div class="box">
  <form id="f">
    <input type="search" id="q" placeholder="Ketik kata kunci… (mis. niat, ikhlas, adab, الصلاة)" autofocus>
    <button>Cari</button>
  </form>
  <div class="chips">
    <label><input type="checkbox" value="sanusi" checked>21 Kitab</label>
    <label><input type="checkbox" value="gbooks" checked>Google Books</label>
    <label><input type="checkbox" value="openalex" checked>OpenAlex (jurnal)</label>
  </div>
</div>

<main>
  <div class="status" id="st">Masukkan kata kunci untuk mulai mencari.</div>
  <div id="res"></div>
</main>

<dialog id="dlg">
  <div class="mh"><b id="mt"></b><span><a id="mo" target="_blank" rel="noopener">Buka sumber ↗</a> <button id="mc">Tutup</button></span></div>
  <div class="mb" id="mbody"></div>
</dialog>
<footer>Maktabah Malika Boarding School · Niat karena Allah, amalkan ilmu.</footer>

<script src="config.js"></script>
<script>
const C = window.MALIKA_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = h => new DOMParser().parseFromString(String(h || ""), "text/html").body.textContent || "";
const hasArab = s => /[\u0600-\u06FF]/.test(s);
function hl(text, q){
  let t = esc(text);
  q.split(/\s+/).filter(w => w.length > 1).forEach(w => {
    const r = new RegExp("(" + esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    t = t.replace(r, "<mark>$1</mark>");
  });
  return t;
}
function snippets(text, q, n = 2){
  const t = strip(text).replace(/\s+/g, " ").trim();
  if (!t) return [];
  const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  const sents = t.split(/(?<=[.!?؟۔])\s+/);
  const hit = sents.filter(s => words.some(w => s.toLowerCase().includes(w)));
  const pick = (hit.length ? hit : sents).slice(0, n).join(" ");
  return [pick.length > 380 ? pick.slice(0, 380) + "…" : pick];
}

/* ---------- Sumber 1: API 21 Kitab (Ahmad Sanusi) ---------- */
async function searchSanusi(q){
  const S = C.sanusi; if (!S || !S.enabled) return [];
  const u = new URL(S.baseUrl + S.searchPath);
  u.searchParams.set(S.queryParam || "q", q);
  Object.entries(S.extraParams || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const headers = {};
  if (S.apiKey && S.apiKeyHeader) headers[S.apiKeyHeader] = S.apiKey;
  const r = await fetch(u, { headers });
  if (!r.ok) throw new Error("21 Kitab: HTTP " + r.status);
  const j = await r.json();
  // Penormal tolerant: cari array hasil di respons apa pun
  let arr = Array.isArray(j) ? j : (j.data?.results || j.data || j.results || j.hasil || j.items || []);
  if (!Array.isArray(arr)) arr = Object.values(arr);
  const pick = (o, keys) => { for (const k of keys) if (o[k]) return o[k]; return ""; };
  return arr.slice(0, 15).map(o => {
    const arab = pick(o, ["arab","arabic","text_ar","teks_arab","matn"]);
    const idn = pick(o, ["indonesia","terjemah","translation","text","teks","content","isi","id"]);
    const kitab = pick(o, ["kitab","book","collection","nama_kitab","source"]);
    const no = pick(o, ["nomor","number","no","hadith_number","id"]);
    return {
      src: "21 Kitab", title: pick(o, ["judul","title","name","bab","chapter"]) || (kitab + (no ? " no. " + no : "")) || "Teks kitab",
      text: (idn && typeof idn !== "object" ? idn : "") || (arab || ""), arab,
      author: pick(o, ["penulis","author","perawi","narrator"]) || kitab || "Ahmad Sanusi Open API",
      url: pick(o, ["url","link"]) || "", year: "", inline: true, raw: o
    };
  });
}

/* ---------- Sumber 2: Google Books ---------- */
async function searchGBooks(q){
  const u = new URL("https://www.googleapis.com/books/v1/volumes");
  u.searchParams.set("q", q); u.searchParams.set("maxResults", 10);
  if (C.googleBooksKey) u.searchParams.set("key", C.googleBooksKey);
  const r = await fetch(u); if (!r.ok) throw new Error("Google Books: HTTP " + r.status);
  const j = await r.json();
  return (j.items || []).map(b => {
    const v = b.volumeInfo || {};
    return {
      src: "Google Books", title: v.title + (v.subtitle ? ": " + v.subtitle : ""),
      text: b.searchInfo?.textSnippet || v.description || "",
      author: (v.authors || []).join(", ") || v.publisher || "Penulis tidak diketahui",
      url: v.infoLink || v.canonicalVolumeLink, year: (v.publishedDate || "").slice(0, 4),
      embed: b.accessInfo?.embeddable ? "https://books.google.com/books?id=" + b.id + "&output=embed" : ""
    };
  });
}

/* ---------- Sumber 3: OpenAlex ---------- */
function abstractOf(ix){
  if (!ix) return "";
  const out = [];
  for (const [w, pos] of Object.entries(ix)) pos.forEach(p => out[p] = w);
  return out.join(" ");
}
async function searchOpenAlex(q){
  const u = new URL("https://api.openalex.org/works");
  u.searchParams.set("search", q); u.searchParams.set("per-page", 10);
  if (C.openAlexMailto) u.searchParams.set("mailto", C.openAlexMailto);
  const r = await fetch(u); if (!r.ok) throw new Error("OpenAlex: HTTP " + r.status);
  const j = await r.json();
  return (j.results || []).map(w => ({
    src: "OpenAlex", title: w.display_name || "(tanpa judul)",
    text: abstractOf(w.abstract_inverted_index),
    author: (w.authorships || []).slice(0, 4).map(a => a.author?.display_name).filter(Boolean).join(", ") || "Penulis tidak diketahui",
    url: w.doi || w.primary_location?.landing_page_url || w.id, year: w.publication_year || ""
  }));
}

/* ---------- Render ---------- */
const sources = { sanusi: searchSanusi, gbooks: searchGBooks, openalex: searchOpenAlex };
let store = [];
function card(it, i, q){
  const sn = snippets(it.text, q);
  const arab = it.arab && hasArab(it.arab) ? `<p class="arab">${hl(strip(it.arab).slice(0, 300), q)}</p>` : "";
  return `<div class="card">
    <h3 data-i="${i}">${hl(it.title, q)}</h3>${arab}
    ${sn.map(s => `<p>${hl(s, q)}</p>`).join("")}
    <div class="meta"><span class="tag">${esc(it.src)}</span><span>✍ ${esc(it.author)}${it.year ? " · " + esc(it.year) : ""}</span>
    <button data-i="${i}">Baca di sini</button>${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">Sumber ↗</a>` : ""}</div></div>`;
}
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  const chosen = [...document.querySelectorAll(".chips input:checked")].map(c => c.value);
  $("#st").textContent = "Mencari “" + q + "”…"; $("#res").innerHTML = ""; store = [];
  const settled = await Promise.allSettled(chosen.map(k => sources[k](q)));
  let html = "", errs = [], total = 0;
  settled.forEach((s, idx) => {
    if (s.status === "rejected") { errs.push(s.reason.message); return; }
    if (!s.value.length) return;
    html += `<div class="group">${esc(s.value[0].src)} (${s.value.length})</div>`;
    s.value.forEach(it => { store.push(it); html += card(it, store.length - 1, q); total++; });
  });
  $("#res").innerHTML = html || "";
  $("#st").textContent = total ? `${total} hasil ditemukan.` : "Tidak ada hasil yang relevan.";
  if (errs.length) $("#st").textContent += " ⚠ " + errs.join(" · ") + " (cek config.js / CORS)";
});
$("#res").addEventListener("click", e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  const it = store[+el.dataset.i], q = $("#q").value.trim(), b = $("#mbody");
  $("#mt").textContent = it.title; $("#mo").href = it.url || "#"; $("#mo").style.display = it.url ? "" : "none";
  if (it.embed) b.innerHTML = `<iframe src="${esc(it.embed)}" title="${esc(it.title)}"></iframe>`;
  else {
    const arab = it.arab && hasArab(it.arab) ? `<p class="arab">${esc(strip(it.arab))}</p>` : "";
    b.innerHTML = `${arab}<p style="line-height:1.8">${hl(strip(it.text) || "Teks lengkap tersedia di sumber asli.", q)}</p>
      <p class="meta">✍ ${esc(it.author)} ${it.year ? "· " + esc(it.year) : ""}</p>`;
  }
  $("#dlg").showModal();
});
$("#mc").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
</script>
</body>
</html>
