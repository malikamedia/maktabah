<script src="config.js"></script>
<script>
const C = window.MALIKA_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = h => new DOMParser().parseFromString(String(h || ""), "text/html").body.textContent || "";
const hasArab = s => /[\u0600-\u06FF]/.test(s);

function hl(text, q){
  let t = esc(text);
  if (!q) return t;
  q.split(/\s+/).filter(w => w.length > 1).forEach(w => {
    const r = new RegExp("(" + esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    t = t.replace(r, "<mark>$1</mark>");
  });
  return t;
}

// ---------- Sumber 1: API 21 Kitab (Ahmad Sanusi) ----------
async function searchSanusi(q){
  const S = C.sanusi; if (!S || !S.enabled) return [];
  const headers = {};
  if (S.apiKey && S.apiKeyHeader) headers[S.apiKeyHeader] = S.apiKey;

  // 1. Ambil daftar semua kitab dulu untuk dicocokkan/dipilih
  const uKitab = new URL(S.baseUrl + "/v1/kitub"); // atau /v1/kitab sesuai endpoint
  let r = await fetch(`${S.baseUrl}/v1/kitab`, { headers });
  if (!r.ok) throw new Error("21 Kitab: HTTP " + r.status);
  const j = await r.json();
  let listKitab = Array.isArray(j) ? j : (j.data?.results || j.data || j.results || []);

  let results = [];
  
  // 2. Cari kitab yang relevan atau lakukan pencarian teks langsung jika API mendukung endpoint search per kitab
  for (let kitab of listKitab.slice(0, 10)) {
    let slug = kitab.slug || kitab.id;
    try {
      // Cek pencarian kata kunci di dalam kitab (Endpoint: /v1/kitab/{slug}/search?q=...)
      let rSearch = await fetch(`${S.baseUrl}/v1/kitab/${slug}/search?q=${encodeURIComponent(q)}`, { headers });
      if (rSearch.ok) {
        let jSearch = await rSearch.json();
        let items = jSearch.data || jSearch.results || jSearch || [];
        if (Array.isArray(items) && items.length > 0) {
          items.forEach(it => {
            results.push({
              src: "21 Kitab",
              title: `${kitab.nama || kitab.judul || slug} — ${it.bab || it.judul_bab || 'Bab Terkait'}`,
              text: it.teks_indonesia || it.terjemah || it.content || it.teks || "",
              arab: it.teks_arab || it.arab || "",
              author: kitab.penulis || "Kandungan Kitab Klasik",
              slug: slug,
              babNomor: it.nomor_bab || it.nomor || 1,
              url: "",
              raw: it
            });
          });
        }
      }
    } catch(err) {
      // Lewati jika salah satu kitab gagal di-fetch
    }
  }

  // Jika pencarian spesifik kosong, tampilkan daftar kitab yang namanya cocok dengan kata kunci
  if (results.length === 0) {
    const matched = listKitab.filter(k => (k.nama || k.judul || "").toLowerCase().includes(q.toLowerCase()));
    return matched.map(k => ({
      src: "21 Kitab",
      title: k.nama || k.judul || "Kitab Kuning",
      text: k.deskripsi || `Kategori: ${k.kategori || 'Klasik'}. Total Bab: ${k.total_bab || 'Lengkap'}. Klik 'Baca di sini' untuk melihat daftar bab dan membaca isi kitab secara utuh sampai selesai.`,
      arab: k.arab || "",
      author: k.penulis || "Turats Islam",
      slug: k.slug || k.id,
      babNomor: 1,
      url: "",
      raw: k
    }));
  }

  return results;
}

// ---------- Sumber Lain (Opsional/Mock aman) ----------
async function searchGBooks(q){ return []; }
async function searchOpenAlex(q){ return []; }

// ---------- Render & Interaksi ----------
const sources = { sanusi: searchSanusi };
let store = [];

function card(it, i, q){
  const arab = it.arab && hasArab(it.arab) ? `<p class="arab">${hl(strip(it.arab).slice(0, 250), q)}</p>` : "";
  const snippetText = strip(it.text).slice(0, 300);
  return `<div class="card">
    <h3 data-i="${i}">${hl(it.title, q)}</h3>
    ${arab}
    <p>${hl(snippetText, q)}…</p>
    <div class="meta">
      <span class="tag">${esc(it.src)}</span>
      <span>✍ ${esc(it.author)}</span>
      <button data-i="${i}">Baca Selengkapnya & Bab ↗</button>
    </div>
  </div>`;
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#st").textContent = "Mencari isi kitab “" + q + ” di server Ahmad Sanusi…"; 
  $("#res").innerHTML = ""; 
  store = [];

  try {
    let dataKitab = await searchSanusi(q);
    store = dataKitab;
    let html = "";
    if (dataKitab.length > 0) {
      html += `<div class="group">Hasil Kitab & Bab (${dataKitab.length})</div>`;
      dataKitab.forEach((it, i) => { html += card(it, i, q); });
    }
    $("#res").innerHTML = html;
    $("#st").textContent = dataKitab.length ? `${dataKitab.length} hasil ditemukan dari 21 Kitab.` : "Tidak ada hasil kitab yang cocok.";
  } catch (err) {
    $("#st").textContent = "⚠ Terjadi kendala koneksi API: " + err.message;
  }
});

// Modal Detail Baca Kitab Per Bab & Navigasi
$("#res").addEventListener("click", async e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  const it = store[+el.dataset.i];
  const b = $("#mbody");
  $("#mt").textContent = it.title; 
  $("#mo").style.display = "none";
  b.innerHTML = "<p>Memuat isi kitab dan daftar bab...</p>";
  $("#dlg").showModal();

  try {
    const S = C.sanusi;
    const headers = S.apiKey ? { [S.apiKeyHeader || "X-API-Key"]: S.apiKey } : {};
    
    // Ambil detail kitab lengkap + daftar bab (Endpoint: /v1/kitab/{slug})
    const resDetail = await fetch(`${S.baseUrl}/v1/kitab/${it.slug}`, { headers });
    const detailJson = await resDetail.json();
    const detail = detailJson.data || detailJson;

    let babList = detail.daftar_bab || detail.babs || detail.chapters || [];
    
    let htmlContent = `<h2>${esc(detail.nama || it.title)}</h2>`;
    htmlContent += `<p><b>Penulis:</b> ${esc(detail.penulis || it.author)} | <b>Total Bab:</b> ${babList.length || 'Tersedia'}</p><hr style="border:0;border-top:1px solid var(--line);margin:10px 0">`;
    
    if (babList.length > 0) {
      htmlContent += `<h3>Daftar Bab (Klik untuk Baca):</h3><ul style="padding-left: 20px; line-height: 1.8;">`;
      babList.forEach((bab, idx) => {
        let noBab = bab.nomor || idx + 1;
        let judulBab = bab.judul || bab.title || `Bab ${noBab}`;
        htmlContent += `<li><a href="#" onclick="muatTeksBab('${it.slug}', ${noBab}); return false;" style="color:var(--navy2); font-weight:600;">${esc(judulBab)}</a></li>`;
      });
      htmlContent += `</ul>`;
    } else {
      htmlContent += `<div style="direction:rtl; font-size:1.2rem; line-height:2; background:var(--card); padding:10px;">${it.arab || ''}</div>`;
      htmlContent += `<p style="line-height:1.8; margin-top:15px;">${esc(it.text)}</p>`;
    }

    b.innerHTML = htmlContent;
  } catch(err) {
    b.innerHTML = `<p>Gagal memuat detail kitab: ${err.message}</p><p style="line-height:1.8">${esc(it.text)}</p>`;
  }
});

// Fungsi pembantu untuk memuat isi bab spesifik saat diklik
async function muatTeksBab(slug, nomorBab) {
  const b = $("#mbody");
  b.innerHTML = `<p>Memuat Bab ${nomorBab}...</p>`;
  try {
    const S = C.sanusi;
    const headers = S.apiKey ? { [S.apiKeyHeader || "X-API-Key"]: S.apiKey } : {};
    const resBab = await fetch(`${S.baseUrl}/v1/kitab/${slug}/bab/${nomorBab}`, { headers });
    const jBab = await resBab.json();
    const dataBab = jBab.data || jBab;

    let kontenArab = dataBab.teks_arab || dataBab.arab || "";
    let konten Indo = dataBab.teks_indonesia || dataBab.terjemah || dataBab.konten || "";

    b.innerHTML = `
      <button onclick="history.back()" style="margin-bottom:10px; padding:4px 10px; font-size:0.8rem;">← Kembali ke Daftar Bab</button>
      <h3>${esc(dataBab.judul || 'Bab ' + nomorBab)}</h3>
      ${kontenArab ? `<div class="arab" style="background:var(--card); padding:12px; border-radius:8px; margin-bottom:15px;">${kontenArab}</div>` : ''}
      <p style="line-height:1.9; font-size:1rem;">${kontenIndo}</p>
      <div style="margin-top:20px; display:flex; justify-content:space-between;">
        <button onclick="muatTeksBab('${slug}', ${nomorBab - 1})" ${nomorBab <= 1 ? 'disabled style="opacity:0.5"' : ''}>← Bab Sebelumnya</button>
        <button onclick="muatTeksBab('${slug}', ${nomorBab + 1})">Bab Selanjutnya →</button>
      </div>
    `;
  } catch(err) {
    b.innerHTML = `<p>Gagal memuat teks bab. Pastikan koneksi internet stabil.</p>`;
  }
}

$("#mc").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
</script>
